<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimal Notes — дизайн-эталон</title><style>

;gap:8px}.field{min-height:44px;display:flex;align-items:center;gap:8px;justify-content:space-between}.field select,.field input,.search{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;min-height:44px;max-width:100%}.seg{display:flex;border-radius:8px;background:var(--surface);padding:3px;gap:3px}.seg button{flex:1;min-height:38px;font-size:13px}.seg .active{background:var(--bg);color:var(--accent);box-shadow:0 0 0 1px var(--line)}.primary{color:var(--accent);font-weight:650}.search{width:100%;margin-bottom:12px}.hide{display:none}.rangehint{font-size:12px;color:var(--muted);margin-top:8px}.folderadd{display:flex;gap:8px}.folderadd input{min-width:0;flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}@media(max-width:767px){#app{max-width:480px;gap:12px;padding:12px 16px}.layout{display:block}.listpanel{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}.day{height:49px}.month h2{font-size:18px}.month button{padding:5px 7px}.editorbox{min-height:230px}.filters{gap:0 10px;margin-bottom:4px}.filters label{font-size:12px}.count{font-size:10px;padding:0 2px}.calendar{gap:2px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s}}

</style></head><body><div id="app"></div><script>
const icons={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',notes:'<path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/>',archive:'<rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v13h14V8M10 12h4"/>',restore:'<path d="M3 8h18M5 8v13h14V8M3 3h18v5H3zM12 17v-6m-3 3 3-3 3 3"/>',plus:'<path d="M12 5v14M5 12h14"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',folder:'<path d="M3 6h7l2 2h9v12H3z"/>',filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',moon:'<path d="M20 15A9 9 0 0 1 9 4 9 9 0 1 0 20 15z"/>',check:'<path d="m5 12 4 4L19 6"/>',range:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18M7 15h10"/>'};const I=k=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[k]||''}</svg>`;const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const TODAY='2026-11-25';const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ru',{day:'numeric',month:'long'}):'';const F=[{id:'work',name:'Работа',color:'#6695de'},{id:'study',name:'Учёба',color:'#68a98a'},{id:'personal',name:'Личное',color:'#ce9b56'}];let notes=[{id:1,f:'work',text:'Аудит проекта\n\nПроверить архитектуру и производительность.',a:'2026-11-23',b:'2026-11-28'},{id:2,f:'work',text:'Рабочие заметки\n\nПроверить результаты тестирования.',a:TODAY},{id:3,f:'study',text:'Подготовка к семинару\n\nИзучить материалы.',a:TODAY},{id:4,f:'personal',text:'Личные планы\n\nСоставить расписание.',a:TODAY},{id:5,f:'study',text:'Конспект лекции\n\nОсновные положения.',a:'2026-11-23'},{id:6,f:'personal',text:'Идеи и мысли\n\nЗаметка без даты.'},{id:7,f:'work',text:'Завершённый проект\n\nПроект завершён.',a:'2026-11-10',arch:true},{id:8,f:'work',text:'План проекта',a:'2026-11-12'},{id:9,f:'study',text:'Доклад',a:'2026-11-19'},{id:10,f:'personal',text:'Покупки',a:'2026-11-28'}];notes.forEach((n,i)=>n.modified=['2026-11-25T18:42:00','2026-11-25T16:15:00','2026-11-25T12:10:00','2026-11-24T19:30:00','2026-11-23T14:05:00','2026-11-23T09:20:00','2026-11-10T15:00:00','2026-11-12T11:00:00','2026-11-19T10:00:00','2026-11-22T17:00:00'][i]);const stamp=n=>new Date(n.modified||Date.now()).toLocaleString('ru',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});const shortStamp=n=>new Date(n.modified||Date.now()).toLocaleDateString('ru',{day:'numeric',month:'short',year:'numeric'});const group=n=>{let d=(n.modified||'').slice(0,10);return d===TODAY?'Сегодня':d==='2026-11-24'?'Вчера':fmt(d)};let tab='calendar',selected=new Set(F.map(f=>f.id)),y=2026,m=10,a=TODAY,b=TODAY,range=false,pending=false,filters=false,details=false,query='',draft=null,mode='none',adding=false,dark=false;const app=document.querySelector('#app');const folder=id=>F.find(f=>f.id===id)||{name:'Без папки',color:'#888'};const title=n=>n.text.split('\n').find(s=>s.trim())?.replace(/^#+\s*/,'')||'Без названия';const overlaps=(n,s,e)=>!!n.a&&n.a<=e&&(n.b||n.a)>=s;const dateLabel=n=>n.a?(n.b&&n.b!==n.a?`${fmt(n.a)} – ${fmt(n.b)}`:fmt(n.a)):'Без даты';const btn=(label,icon,action,cls='')=>`<button class="${cls}" data-action="${action}" aria-label="${E(label)}" title="${E(label)}">${I(icon)}</button>`;
function filterHTML(){return `<div class="filterwrap">${btn('Фильтр папок','filter','filters')}${filters?`<div class="filterpop"><h3>Папки</h3><div class="filters"><label><input type="checkbox" data-all ${selected.size===F.length?'checked':''}>Все папки</label>${F.map(f=>`<label><input type="checkbox" data-folder="${f.id}" ${selected.has(f.id)?'checked':''}><i class="dot" style="background:${f.color}"></i>${E(f.name)}</label>`).join('')}</div><button data-action="addfolder">${I('plus')} Новая папка</button>${adding?addForm():''}</div>`:''}</div>`}
function addForm(){return '<div class="folderadd"><input id="foldername" placeholder="Название папки"><input type="color" id="newcolor" value="#9275ca" aria-label="Цвет новой папки"><button data-action="commitfolder">Добавить</button></div>'}function calendarHTML(){let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=Math.ceil((first+days)/7)*7;return `<div class="month row"><h2>${new Date(y,m,1).toLocaleDateString('ru',{month:'long',year:'numeric'}).replace(' г.','').replace(/^./,c=>c.toUpperCase())}</h2><span class="spacer"></span><button data-action="today">Сегодня</button>${btn('Предыдущий месяц','left','prev')}${btn('Следующий месяц','right','next')}${filterHTML()}</div><div class="calendar-tools row"><button class="${range?'primary':''}" data-action="range">${I('range')} ${range?'Выбор периода':'Выбрать период'}</button></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<div class="weekday">${w}</div>`).join('')}${Array.from({length:cells},(_,i)=>{let d=i-first+1;if(d<1||d>days)return '<div></div>';let s=iso(y,m,d);return `<button class="day ${s===a||s===b?'selected':s>a&&s<b?'inrange':''} ${s===TODAY?'today':''}" data-day="${s}" aria-label="${s}"><span class="num">${d}</span><span class="counts">${F.filter(f=>selected.has(f.id)).map(f=>{let c=notes.filter(n=>!n.arch&&n.f===f.id&&overlaps(n,s,s)).length;return c?`<span class="count" style="background:${f.color}" title="${E(f.name)}: ${c}">${c}</span>`:''}).join('')}</span></button>`}).join('')}</div>${range?`<p class="rangehint">${pending?'Выбери конечную дату':a===b?'Выбери начало периода':fmt(a)+' – '+fmt(b)}</p>`:''}`}

function render(){document.body.classList.toggle('dark',dark);if(draft){app.innerHTML=`<header>${btn('Назад','left','back')}<span class="spacer"></span>${btn('Параметры заметки','filter','details')}<button class="primary" data-action="save">Готово ${I('check')}</button></header><main class="editor">${draft.id?`<div class="editorstamp">${stamp(draft)}</div>`:''}<div class="editorbox" role="textbox" aria-label="Текст заметки" aria-multiline="true" contenteditable="plaintext-only">${draft.text?draft.text.split('\n').map(l=>`<div>${E(l)||'<br>'}</div>`).join(''):'<div><br></div>'}</div>${details?`<div class="sheetback" data-dismiss="details"></div><div class="meta sheet"><div class="row"><h3>Параметры заметки</h3><span class="spacer"></span><button data-action="details">Готово</button></div><div class="row">${I('folder')}<h3>Папка</h3><span class="spacer"></span>${btn('Создать папку','plus','addfolder')}</div><div class="folderchoices">${F.map(f=>`<div class="folderrow"><button class="folderchoice ${draft.f===f.id?'active':''}" data-action="choose:${f.id}"><i class="dot" style="background:${f.color}"></i>${E(f.name)}<span class="spacer"></span>${draft.f===f.id?I('check'):''}</button><input class="foldercolor" type="color" data-color="${f.id}" value="${f.color}" aria-label="Цвет папки ${E(f.name)}"></div>`).join('')}</div>${adding?addForm():''}<div class="row">${I('calendar')}<h3>Привязка к календарю</h3></div><div class="seg">${[['none','Без даты'],['single','Дата'],['range','Период']].map(([v,t])=>`<button class="${mode===v?'active':''}" data-action="mode:${v}">${t}</button>`).join('')}</div>${mode!=='none'?`<label class="field">${mode==='single'?'Дата заметки':'Начало'}<input type="date" id="start" value="${draft.a||TODAY}"></label>`:''}${mode==='range'?`<label class="field">Окончание<input type="date" id="end" min="${draft.a||TODAY}" value="${draft.b||draft.a||TODAY}"></label><small>Заметка отображается на каждом дне выбранного периода.</small>`:''}${draft.id?`<button data-action="archiveDraft">${I(draft.arch?'restore':'archive')} ${draft.arch?'Восстановить':'В архив'}</button>`:''}</div>`:''}</main>`;return}app.innerHTML=`<main>${tab==='calendar'?`<div class="layout"><section class="panel">${calendarHTML()}</section><section class="panel listpanel">${listHTML()}</section></div>`:`<section><div class="row"><span class="spacer"></span>${filterHTML()}</div>${listHTML()}</section>`}</main><nav>${[['calendar','calendar','Календарь'],['notes','notes','Заметки'],['archive','archive','Архив']].map(([v,i,t])=>`<button class="${tab===v?'active':''}" data-action="tab:${v}">${I(i)}${t}</button>`).join('')}</nav>`}
function capture(){if(!draft)return;let el=document.querySelector('.editorbox');if(el)draft.text=Array.from(el.children).map(x=>x.innerText.replace(/\n$/,'')).join('\n');let f=document.querySelector('#folderselect');if(f)draft.f=f.value;let s=document.querySelector('#start'),e=document.querySelector('#end');if(s)draft.a=s.value;if(e)draft.b=e.value}
function save(){capture();if(!draft.text.trim()){if(draft.id){alert('Заметка не может быть пустой');return false}draft=null;return true}if(mode!=='none'&&!draft.a||mode==='range'&&(!draft.b||draft.b<draft.a)){alert('Проверь даты');return false}if(mode==='none'){delete draft.a;delete draft.b}else if(mode==='single')delete draft.b;let old=notes.find(n=>n.id===draft.id);if(!old||['text','f','a','b','arch'].some(k=>old[k]!==draft[k]))draft.modified=new Date().toISOString();if(draft.id)notes=notes.map(n=>n.id===draft.id?{...draft}:n);else{draft.id=Date.now();notes.push({...draft});selected.add(draft.f)}draft=null;return true}
app.addEventListener('click',ev=>{if(ev.target.dataset.dismiss==='details'){capture();details=false;render();return}let t=ev.target.closest('button');if(!t){if(filters&&!ev.target.closest('.filterwrap')){filters=false;render()}return;}let act=t.dataset.action;if(t.dataset.day){let s=t.dataset.day;if(range){if(!pending){a=b=s;pending=true}else{b=s;if(b<a)[a,b]=[b,a];pending=false}}else a=b=s;render();return}if(t.dataset.open){draft={...notes.find(n=>n.id===+t.dataset.open)};mode=draft.b?'range':draft.a?'single':'none';adding=false;details=false;render();return}if(!act)return;if(draft)capture();if(act==='details')details=!details;else if(act==='theme')dark=!dark;else if(act==='filters')filters=!filters;else if(act==='today'){y=2026;m=10;a=b=TODAY;pending=false}else if(act==='prev'||act==='next'){let d=new Date(y,m+(act==='next'?1:-1),1);y=d.getFullYear();m=d.getMonth()}else if(act==='range'){range=!range;pending=false;if(!range)b=a}else if(act.startsWith('tab:')){tab=act.split(':')[1];query=''}else if(act==='new'){draft={f:F.find(f=>selected.has(f.id))?.id||F[0].id,text:'',a:tab==='calendar'?a:undefined,b:tab==='calendar'&&a!==b?b:undefined};mode=draft.b?'range':draft.a?'single':'none';adding=false;details=false}else if(act==='save'||act==='back'){if(!save())return}else if(act.startsWith('archive:')){let n=notes.find(n=>n.id===+act.split(':')[1]);n.arch=!n.arch}else if(act==='archiveDraft'){draft.arch=!draft.arch;if(!save())return}else if(act.startsWith('mode:')){mode=act.split(':')[1];if(mode!=='none')draft.a=draft.a||TODAY;if(mode==='range')draft.b=draft.b&&draft.b>=draft.a?draft.b:draft.a}else if(act.startsWith('choose:'))draft.f=act.split(':')[1];else if(act==='addfolder')adding=!adding;else if(act==='commitfolder'){let s=document.querySelector('#foldername').value.trim();if(!s||F.some(f=>f.name===s))return;let id='f'+Date.now();F.push({id,name:s,color:document.querySelector('#newcolor').value});selected.add(id);if(draft)draft.f=id;adding=false}render()});app.addEventListener('change',ev=>{let t=ev.target;if(t.dataset.color){capture();F.find(f=>f.id===t.dataset.color).color=t.value;render()}else if(t.matches('[data-all]')){selected=new Set(t.checked?F.map(f=>f.id):[]);render()}else if(t.dataset.folder){t.checked?selected.add(t.dataset.folder):selected.delete(t.dataset.folder);render()}else if(draft&&t.id==='start'){capture();if(draft.b&&draft.b<draft.a)draft.b=draft.a;render()}});app.addEventListener('keydown',ev=>{if(ev.target.matches('.editorbox')&&ev.key==='Enter'){ev.preventDefault();document.execCommand('insertParagraph');}});app.addEventListener('input',ev=>{if(ev.target.matches('.search')){query=ev.target.value;let tmp=document.createElement('div');tmp.innerHTML=listHTML();document.querySelector('#notelist').innerHTML=tmp.querySelector('#notelist').innerHTML;document.querySelector('.listhead small').textContent=tmp.querySelector('.listhead small').textContent}});render();
</script></body></html>
